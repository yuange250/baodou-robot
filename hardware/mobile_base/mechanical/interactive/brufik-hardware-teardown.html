&lt;script&gt;
(() =&gt; {

    shape.lineTo(w - r, -h);
    shape.quadraticCurveTo(w, -h, w, -h + r);
    shape.lineTo(w, h - r);
    shape.quadraticCurveTo(w, h, w - r, h);
    shape.lineTo(-w + r, h);
    shape.quadraticCurveTo(-w, h, -w, h - r);
    shape.lineTo(-w, -h + r);

    const value = roundedBox(dimensions[0], dimensions[1], dimensions[2], radius, mat, bevel);

  function taperedRoundedBox(bottomWidth, bottomDepth, topWidth, topDepth, height, radius, mat) {
    const geometry = new THREE.ExtrudeGeometry(roundedRectShape(bottomWidth, bottomDepth, radius), {
      depth: height,

      bevelEnabled: true,
      bevelThickness: .7,

      bevelSegments: 3

    const position = geometry.attributes.position;
    for (let i = 0; i &lt; position.count; i++) {
      const t = THREE.MathUtils.clamp(position.getZ(i) / height, 0, 1);
      position.setX(i, position.getX(i) * THREE.MathUtils.lerp(1, topWidth / bottomWidth, t));
      position.setY(i, position.getY(i) * THREE.MathUtils.lerp(1, topDepth / bottomDepth, t));

    geometry.rotateX(-Math.PI / 2);
    geometry.computeVertexNormals();
    return new THREE.Mesh(geometry, mat);

  function convexHull(points) {
    const sorted = points.slice().sort((a,b) =&gt; a.x - b.x || a.y - b.y);
    const cross = (o,a,b) =&gt; (a.x-o.x)*(b.y-o.y) - (a.y-o.y)*(b.x-o.x);
    const lower = [];
    for (const p of sorted) { while (lower.length &gt; 1 &amp;&amp; cross(lower.at(-2), lower.at(-1), p) &lt;= 0) lower.pop(); lower.push(p); }
    const upper = [];
    for (let i = sorted.length - 1; i &gt;= 0; i--) { const p = sorted[i]; while (upper.length &gt; 1 &amp;&amp; cross(upper.at(-2), upper.at(-1), p) &lt;= 0) upper.pop(); upper.push(p); }
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }
  function triShape(centerRadius = 50, cornerRadius = 24) {
    const points = [];
    for (const degrees of [90, 210, 330]) {

      const cx = centerRadius * Math.cos(a), cy = centerRadius * Math.sin(a);

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
